<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Reminders</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#111111" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="label">Total monthly</p>
        <p class="total" id="total">0,00 zł</p>
      </div>
      <button id="add-btn" class="primary">+ Add payment</button>
    </header>

    <p id="sync-status" class="sync-note">Connecting…</p>

    <div class="tabs">
      <button id="tab-list" class="tab active">List</button>
      <button id="tab-calendar" class="tab">Calendar</button>
    </div>

    <p id="notif-banner" class="banner hidden">
      Enable notifications to get reminded before bills are due.
      <button id="notif-enable">Enable</button>
      <button id="notif-dismiss" class="text-btn">Dismiss</button>
    </p>

    <div id="form" class="form hidden">
      <input type="text" id="f-name" placeholder="Payment name (e.g. Rent, Netflix)" />
      <input type="number" id="f-amount" placeholder="Amount" min="0" step="0.01" />
      <input type="text" id="f-notes" placeholder="Account / company (e.g. mBank ...1234, PGE)" />

      <div class="row">
        <div style="flex:1;">
          <p class="inline-label" style="margin: 0 0 4px;">Assigned to</p>
          <select id="f-person" class="select">
            <option value="Ogólne">Ogólne</option>
            <option value="Paweł">Paweł</option>
            <option value="Marta">Marta</option>
          </select>
        </div>
        <div style="flex:1;">
          <p class="inline-label" style="margin: 0 0 4px;">Frequency</p>
          <select id="f-frequency" class="select">
            <option value="1">Every month</option>
            <option value="2">Every 2 months</option>
          </select>
        </div>
      </div>

      <p class="inline-label" style="margin: 0 0 -4px;">Due day of month</p>
      <div id="day-picker" class="day-picker"></div>
      <p class="picker-selected">Selected day: <span id="day-picker-selected">none</span></p>

      <div class="row">
        <label for="f-lead" class="inline-label">Remind me this many days before:</label>
        <input type="number" id="f-lead" placeholder="2" min="0" max="27" step="1" style="max-width: 70px;" />
      </div>
      <p id="f-error" class="error hidden"></p>
      <div class="row end">
        <button id="f-cancel">Cancel</button>
        <button id="f-save" class="primary">Save</button>
      </div>
    </div>

    <div id="filter-chips" class="filter-chips"></div>

    <div id="list-view">
      <div id="list" class="list"></div>
      <p id="empty" class="empty hidden">No payments yet. Add your first one above.</p>
    </div>

    <div id="calendar-view" class="hidden">
      <div class="cal-header">
        <button id="cal-prev">&larr;</button>
        <p id="cal-month-label" class="cal-month-label"></p>
        <button id="cal-next">&rarr;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
