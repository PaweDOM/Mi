<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Reminders</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#111111" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="label">Total monthly</p>
        <p class="total" id="total">$0.00</p>
      </div>
      <button id="add-btn" class="primary">+ Add payment</button>
    </header>

    <p id="notif-banner" class="banner hidden">
      Enable notifications to get reminded before bills are due.
      <button id="notif-enable">Enable</button>
      <button id="notif-dismiss" class="text-btn">Dismiss</button>
    </p>

    <div id="form" class="form hidden">
      <input type="text" id="f-name" placeholder="Payment name (e.g. Rent, Netflix)" />
      <div class="row">
        <input type="number" id="f-amount" placeholder="Amount" min="0" step="0.01" />
        <input type="number" id="f-day" placeholder="Due day (1-31)" min="1" max="31" step="1" />
      </div>
      <div class="row">
        <label for="f-lead" class="inline-label">Remind me this many days before:</label>
        <input type="number" id="f-lead" placeholder="2" min="0" max="27" step="1" style="max-width: 70px;" />
      </div>
      <p id="f-error" class="error hidden"></p>
      <div class="row end">
        <button id="f-cancel">Cancel</button>
        <button id="f-save" class="primary">Save</button>
      </div>
    </div>

    <div id="list" class="list"></div>
    <p id="empty" class="empty hidden">No payments yet. Add your first one above.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
